name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '23 * * * *' # 변경된 cron으로 비활성 예약 작업 재활성화
    - cron: '41 3 1 * *' # 저장소 비활성 60일 제한 방지
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Wake-up Script
        run: python keep_alive_script.py

      - name: Keep scheduled workflow active
        if: always() && github.event.schedule == '41 3 1 * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active"
          git push
